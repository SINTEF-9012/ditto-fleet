# Monitoring Agent of the lab gateway: reports the installed Debian packages only.

[global_tags]
  ip_address = "${IP_ADDRESS}"
  system_name = "Debian"
  system_version = "12"
  system_description = "Debian GNU/Linux 12 (bookworm)"

[agent]
  interval = "${MONITOR_INTERVAL}"
  round_interval = false
  flush_interval = "1s"
  hostname = "${HOST_NAME}"
  omit_hostname = false

[[inputs.exec]]
  commands = ["/etc/telegraf/dpkg.sh"]
  data_format = "json"
  json_string_fields = ["packages"]
  timeout = "10s"
  [inputs.exec.tags]
    metric_source = "packages"

[[outputs.mqtt]]
  servers = ["${MQTT_BROKER}"]
  topic = "ditto-monitoring-agent/${HOST_NAME}/{{ .PluginName }}"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1
  data_format = "json"
  json_timestamp_units = "1s"
